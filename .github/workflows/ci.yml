name: CI

on:
  pull_request:
    branches: [main, epic/inspector-v2]
  push:
    branches: [main, epic/inspector-v2]

permissions:
  contents: read

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  lint:
    # The check name main's branch protection requires.
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: goinstall
          version: 8f3b0c7ed018e57905fbd873c697e0b1ede605a5 # v2.11.4

  ui:
    name: UI lint, type check, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check that the generated types are up to date
        run: |
          npm run gen:types
          if [ -n "$(git status --porcelain -- src/a2a)" ]; then
            echo "ui/src/a2a doesn't match the schemas. Run 'npm run gen:types' in ui/ and commit the result."
            git status --porcelain -- src/a2a
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Check that ui/dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "ui/dist doesn't match the UI sources. Run 'npm run build' in ui/ and commit ui/dist."
            git status --porcelain -- dist
            exit 1
          fi
