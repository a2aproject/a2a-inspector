version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/ui'
    schedule:
      interval: 'monthly'
    groups:
      ui-npm-dependencies:
        patterns:
          - '*'
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      go-dependencies:
        patterns:
          - '*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'
