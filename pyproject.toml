[project]
name = "a2a-inspector-workspace"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[all]>=1.1.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "jwcrypto>=1.5.9",
    "pydantic>=2.13.5",
    "pyjwt>=2.13.0",
    "sse-starlette>=3.4.8",
    "starlette>=0.46.1",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.52.4",
    "python-socketio",
    "jinja2",
    "bleach>=6.4.0",
]

[tool.setuptools]
packages = ["backend"]

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "types-requests",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12.0",
    "asgi-lifespan>=2.1.0",
    "python-socketio[asyncio_client]",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.pyright]
exclude = [
  "**/__pycache__",
  "**/dist",
  "**/build",
  "**/node_modules",
  "**/venv",
  "**/.venv",
]
reportMissingImports = "none"
reportMissingModuleSource = "none"
